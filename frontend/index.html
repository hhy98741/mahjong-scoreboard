<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahjong Scoreboard</title>
    <script>
      // Apply the persisted theme before first paint so the app never
      // flashes dark on load for a light-theme user. See docs/04-frontend.md.
      try {
        var theme = localStorage.getItem('mahjong.theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
